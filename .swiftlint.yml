nesting:
  type_level: 3

line_length:
  warning: 102
  error: 120

file_length:
  warning: 1000
  error: 1500

type_body_length:
  warning: 700
  error: 900

function_body_length:
  warning: 100
  error: 150

function_parameter_count:
  warning: 8
  error: 10

cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: true

large_tuple:
  warning: 4
  error: 6

trailing_comma:
  mandatory_comma: true

disabled_rules:
  - identifier_name
  - opening_brace
  - multiple_closures_with_trailing_closure
