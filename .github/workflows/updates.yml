name: Updates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/updates.yml
      - scripts/appcast.swift
      - scripts/prepare-updates.sh
      - scripts/verify-feed.sh
      - scripts/validate-release.swift
  release:
    types: [published, edited, unpublished, deleted]
  repository_dispatch:
    types: [site-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates-feed
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check out the site without mixing application history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Verify public stable releases and generate the latest seven updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare-updates.sh site
      - name: Commit the feed and export the complete site snapshot
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add appcast.xml
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m 'chore(updates): refresh stable appcast'
            git -C site push origin HEAD:refs/heads/gh-pages
          fi
          mkdir -p _site
          git -C site rev-parse HEAD
          git -C site archive HEAD | tar -x -C _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages-artifact
      - name: Extract the exact feed uploaded by the prepare job
        run: tar -xOf pages-artifact/artifact.tar ./appcast.xml > expected-appcast.xml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public feed bytes
        run: bash scripts/verify-feed.sh expected-appcast.xml https://eureka-0.github.io/Imaxe/appcast.xml feed-diagnostics
      - name: Preserve public feed diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feed-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
